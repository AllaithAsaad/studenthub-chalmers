name: Import StudentHub sources
on:
  push:
    paths:
      - 'studenthub-source.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack the reviewed source archive
        run: |
          python3 - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path, PurePosixPath
          archive = Path('studenthub-source.zip')
          expected = 'cf915dd99009a90b88f551609bf794d83ac5f5ed5bc3e5ac1f9ae49a243c128b'
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit('Source archive checksum mismatch')
          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  p = PurePosixPath(entry.filename)
                  if p.is_absolute() or '..' in p.parts or p.parts[0] in {'.git', '.github'}:
                      raise SystemExit('Unexpected archive path')
                  if (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('Symlinks are not allowed')
              source.extractall('.')
          archive.unlink()
          PY
      - name: Commit the complete Flutter project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github'
          git commit -m 'feat: add tested StudentHub Chalmers Flutter application'
          git push origin HEAD:main
