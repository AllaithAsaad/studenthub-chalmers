name: studenthub_chalmers
description: A thoughtful, local-first study companion. Built with Flutter and SQLite.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.11.3
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  sqflite_common: ^2.5.8
  sqflite_common_ffi_web: ^1.1.0
  path: ^1.9.1
  intl: ^0.20.2
  http: ^1.6.0
  cupertino_icons: ^1.0.8
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.0
flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
